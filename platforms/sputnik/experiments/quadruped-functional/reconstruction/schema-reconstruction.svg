<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1080" viewBox="0 0 1500 1080" role="img" aria-labelledby="title desc">
<title id="title">Quadrupède fonctionnel : schéma de reconstruction</title><desc id="desc">Vue de dessus du châssis, schéma d'une patte fléchie à trois articulations et distribution du moteur créatif unique avec réduction commune et commandes indépendantes.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#52657a"/></marker></defs>
<rect width="1500" height="1080" fill="#f4f7fb"/><g font-family="DejaVu Sans,Arial,sans-serif" fill="#17283c"><text x="65" y="66" font-size="36" font-weight="bold">Quadrupède fonctionnel — reconstruction expérimentale</text><text x="65" y="103" font-size="19" fill="#465b72">Un moteur créatif · 4 pattes · 3 axes indépendants par patte · masse cible 10 000 unités</text>
<rect x="45" y="135" width="660" height="500" rx="18" fill="#fff" stroke="#d6e0eb"/><text x="72" y="178" font-size="25" font-weight="bold">1 · Implantation — vue de dessus</text><text x="72" y="207" font-size="17" fill="#52657a">Schéma fonctionnel, non à l’échelle des engrenages</text>
<rect x="245" y="260" width="240" height="290" rx="17" fill="#dfe9f3" stroke="#345774" stroke-width="4"/><line x1="435" y1="242" x2="435" y2="220" stroke="#52657a" stroke-width="4" marker-end="url(#arrow)"/><text x="315" y="239" font-size="17">AVANT</text><text x="304" y="390" font-size="21" font-weight="bold">CHÂSSIS</text><text x="298" y="419" font-size="16">14 × 24 blocs</text><text x="280" y="445" font-size="15">entraxe des pivots</text>
<g fill="#216b9a" stroke="#124360" stroke-width="3"><circle cx="245" cy="270" r="17"/><circle cx="485" cy="270" r="17"/><circle cx="245" cy="540" r="17"/><circle cx="485" cy="540" r="17"/></g><g font-size="16"><text x="84" y="275">avant gauche</text><text x="507" y="275">avant droite</text><text x="84" y="546">arrière gauche</text><text x="507" y="546">arrière droite</text></g><g stroke="#52657a" stroke-width="3"><line x1="211" y1="269" x2="226" y2="269"/><line x1="504" y1="269" x2="495" y2="269"/><line x1="211" y1="540" x2="226" y2="540"/><line x1="503" y1="540" x2="496" y2="540"/></g><text x="74" y="598" font-size="16" fill="#52657a">Chaque rond représente la racine d’une patte.</text>
<rect x="735" y="135" width="720" height="500" rx="18" fill="#fff" stroke="#d6e0eb"/><text x="765" y="178" font-size="25" font-weight="bold">2 · Une patte — vue latérale simplifiée</text><text x="765" y="207" font-size="17" fill="#52657a">Genou fléchi au repos : réserve de course vers le bas</text>
<rect x="845" y="252" width="220" height="48" rx="8" fill="#dfe9f3" stroke="#345774" stroke-width="3"/><text x="868" y="283" font-size="16">châssis et transmission</text><circle cx="935" cy="310" r="19" fill="#216b9a" stroke="#124360" stroke-width="3"/><line x1="935" y1="310" x2="1040" y2="419" stroke="#bd7b38" stroke-width="18" stroke-linecap="round"/><circle cx="1040" cy="419" r="18" fill="#e89532" stroke="#a55d0a" stroke-width="3"/><line x1="1040" y1="419" x2="945" y2="538" stroke="#bd7b38" stroke-width="18" stroke-linecap="round"/><rect x="913" y="533" width="65" height="25" rx="6" fill="#70bc64" stroke="#3c8237" stroke-width="3"/><line x1="945" y1="567" x2="945" y2="607" stroke="#559b4b" stroke-width="4" marker-end="url(#arrow)"/>
<text x="1120" y="301" font-size="16">Axe 1 : latéral</text><text x="1120" y="326" font-size="16">Axe 2 : hanche avant / arrière</text><text x="1120" y="426" font-size="16">Axe 3 : genou</text><text x="1110" y="469" font-size="16">2 segments de 7 blocs</text><text x="1000" y="557" font-size="16">pied slime</text><text x="992" y="598" font-size="16">extension disponible</text>
<rect x="45" y="660" width="1410" height="350" rx="18" fill="#fff" stroke="#d6e0eb"/><text x="72" y="705" font-size="25" font-weight="bold">3 · Puissance et commande des articulations</text>
<g font-size="17" text-anchor="middle"><rect x="75" y="750" width="190" height="88" rx="10" fill="#cde7f6" stroke="#3e7da4" stroke-width="2"/><text x="170" y="783" font-weight="bold">Moteur unique</text><text x="170" y="809">128 tr/min</text><rect x="315" y="750" width="215" height="88" rx="10" fill="#fce8c5" stroke="#b87f20" stroke-width="2"/><text x="423" y="783" font-weight="bold">Réduction commune</text><text x="423" y="809">4:1 → 32 tr/min</text><rect x="580" y="750" width="220" height="88" rx="10" fill="#dfe9f3" stroke="#637f99" stroke-width="2"/><text x="690" y="783" font-weight="bold">Distribution</text><text x="690" y="809">4 pattes × 3 axes</text><rect x="850" y="750" width="270" height="88" rx="10" fill="#fce8c5" stroke="#b87f20" stroke-width="2"/><text x="985" y="783" font-weight="bold">Embrayage + inverseur</text><text x="985" y="809">réduction locale 2:1</text><rect x="1170" y="750" width="225" height="88" rx="10" fill="#d3eed0" stroke="#5c9b53" stroke-width="2"/><text x="1282" y="783" font-weight="bold">Pivot sélectionné</text><text x="1282" y="809">±16 tr/min</text></g>
<g fill="none" stroke="#52657a" stroke-width="3" marker-end="url(#arrow)"><path d="M265 794 H307"/><path d="M530 794 H572"/><path d="M800 794 H842"/><path d="M1120 794 H1162"/><path d="M690 937 V853"/></g><rect x="540" y="900" width="300" height="70" rx="10" fill="#eee3fa" stroke="#8663a6" stroke-width="2"/><text x="690" y="930" text-anchor="middle" font-size="17" font-weight="bold">Sputnik + redstone Create</text><text x="690" y="954" text-anchor="middle" font-size="15">sélection et sens des 12 axes</text><text x="875" y="905" font-size="16" fill="#52657a">Capteur optique embarqué → Sputnik</text><text x="875" y="932" font-size="16" fill="#52657a">Arrêt devant mur testé ; contournement à valider</text>
<text x="65" y="1050" font-size="15" fill="#52657a">Vue simplifiée : consulter le rapport de reconstruction pour les blocs, coordonnées relatives et résultats réels.</text></g></svg>
